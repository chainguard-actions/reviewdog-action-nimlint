name: nimlint

on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  nimlint:
    name: runner / nimlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: nimlint-github-pr-review
        uses: reviewdog/action-nimlint@eec54c6010f7f660ff8aac5b3ef5d1d129a6d69d # master
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review # Change reporter.
          src: 'testdata/*.nim'

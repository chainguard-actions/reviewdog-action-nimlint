name: Test broken nim code fails with fail_level error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove stale log
        run: rm -f tests/fixtures/broken/check.log
      - id: action
        uses: .
        continue-on-error: true
        with:
          workdir: tests/fixtures/broken
          src: '*.nim'
          reporter: local
          filter_mode: nofilter
          fail_level: error
      - name: Assert action failed due to the type error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          LOG="$GITHUB_WORKSPACE/tests/fixtures/broken/check.log"
          if [ -f "$LOG" ]; then echo "--- check.log ---"; cat "$LOG"; fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure because broken.nim has a type error"
            exit 1
          fi
          echo "PASS"

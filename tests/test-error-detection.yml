name: Test error detection - nim file with errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a nim source file with syntax errors
        run: |
          mkdir -p "$GITHUB_WORKSPACE/src"
          # This nim file has a syntax error (undefined variable)
          printf 'let x = undefinedVariable\necho x\n' > "$GITHUB_WORKSPACE/src/broken.nim"

      - name: Run action expecting failure due to nim errors
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: error
          src: src/broken.nim
        continue-on-error: true

      - name: Assert action failed due to nim errors
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail due to nim errors, but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly failed when nim errors were found"

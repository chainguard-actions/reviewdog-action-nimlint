name: Test workdir input - run nim check in subdirectory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run nimlint action with custom workdir using committed fixture
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: 'tests/fixtures'
          src: 'hello.nim'
          reporter: 'local'
          filter_mode: 'nofilter'
          fail_level: 'none'
          fail_on_error: 'false'
          level: 'error'

      - name: Assert action completed successfully with workdir
        run: |
          echo "Action completed with custom workdir without error"
          echo "PASS"

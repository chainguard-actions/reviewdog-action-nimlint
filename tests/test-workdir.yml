name: Test custom workdir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare nim source file in workdir
        run: |
          mkdir -p pristine/reviewdog--action-nimlint/v1.18.2/testdata/src
          cat > pristine/reviewdog--action-nimlint/v1.18.2/testdata/src/main.nim << 'EOF'
          echo "Hello from workdir"
          EOF

      - id: action
        uses: .
        with:
          github_token: dummy-token
          workdir: pristine/reviewdog--action-nimlint/v1.18.2/testdata
          src: src/main.nim
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: warning

      - name: Assert action completed with custom workdir
        run: |
          echo "Action completed with custom workdir"
          echo "PASS"

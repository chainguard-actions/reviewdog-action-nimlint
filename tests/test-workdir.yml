name: Test custom workdir
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create nim source file in subdirectory
        run: |
          mkdir -p myproject/src
          echo 'echo "hello from subdir"' > myproject/src/main.nim

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: 'myproject'
          src: 'src/main.nim'
          reporter: 'local'
          filter_mode: 'nofilter'
          level: 'error'
          fail_level: 'none'

      - name: Assert action completed successfully with custom workdir
        run: |
          echo "Action completed with custom workdir without error"
          echo "PASS"

name: Test info level reporting
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a valid nim source file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/src"
          echo 'proc greet(name: string): string = "Hello, " & name' > "$GITHUB_WORKSPACE/src/greet.nim"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          src: src/greet.nim
          level: info
          reporter: local
          filter_mode: nofilter
          fail_level: none

      - name: Assert action completed successfully with info level
        run: |
          echo "PASS: action ran successfully with info level reporting"

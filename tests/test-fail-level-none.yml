name: Test fail_level=none does not fail on issues
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create nim source file with a warning-triggering pattern
        run: |
          mkdir -p src
          # A nim file that compiles but may produce hints/warnings
          cat > src/warn.nim << 'EOF'
          var x: int = 0
          echo x
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          src: 'src/warn.nim'
          reporter: 'local'
          filter_mode: 'nofilter'
          level: 'warning'
          fail_level: 'none'

      - name: Assert action did not fail (fail_level=none)
        run: |
          echo "Action completed with fail_level=none without error"
          echo "PASS"

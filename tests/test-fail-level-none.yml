name: Test fail_level=none always exits 0
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a nim source file with a warning-level issue
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/warn/src"
          # Create a nim file that will produce a hint/warning (unused variable)
          cat > "$GITHUB_WORKSPACE/tests/fixtures/warn/src/warn.nim" << 'EOF'
          var unused = 10
          echo "done"
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/warn
          src: src/warn.nim
          reporter: local
          filter_mode: nofilter
          level: warning
          fail_level: none

      - name: Assert action ran (fail_level=none means exit 0 regardless of findings)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_level=none, reviewdog always exits 0, so action should succeed
          # unless there's a different infrastructure error
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with fail_level=none"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

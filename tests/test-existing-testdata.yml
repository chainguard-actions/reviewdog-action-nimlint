name: Test with existing testdata nim file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: dummy-token
          src: pristine/reviewdog--action-nimlint/v1.18.2/testdata/test1.nim
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: info

      - name: Assert action completed with existing testdata
        run: |
          echo "Action completed successfully using existing testdata"
          echo "PASS"

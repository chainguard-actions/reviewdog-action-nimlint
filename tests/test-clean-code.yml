name: Test clean nim code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove stale log
        run: rm -f tests/fixtures/clean/check.log
      - id: action
        uses: .
        with:
          workdir: tests/fixtures/clean
          src: '*.nim'
          reporter: local
          filter_mode: nofilter
          fail_level: error
      - name: Assert no errors reported
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          LOG="$GITHUB_WORKSPACE/tests/fixtures/clean/check.log"
          if [ -f "$LOG" ]; then
            echo "--- check.log ---"; cat "$LOG"
            if grep -q "Error:" "$LOG"; then
              echo "FAIL: unexpected errors in clean code"
              exit 1
            fi
          fi
          echo "PASS"

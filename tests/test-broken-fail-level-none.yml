name: Test broken nim code reported but not failing with fail_level none
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove stale log
        run: rm -f tests/fixtures/broken/check.log
      - id: action
        uses: .
        with:
          workdir: tests/fixtures/broken
          src: '*.nim'
          reporter: local
          filter_mode: nofilter
      - name: Assert error was detected and logged
        run: |
          LOG="$GITHUB_WORKSPACE/tests/fixtures/broken/check.log"
          if [ ! -f "$LOG" ]; then
            echo "FAIL: check.log not produced"
            exit 1
          fi
          echo "--- check.log ---"; cat "$LOG"
          if ! grep -q "broken.nim:1:.*Error:" "$LOG"; then
            echo "FAIL: expected a reviewdog-formatted error for broken.nim line 1"
            exit 1
          fi
          echo "PASS"

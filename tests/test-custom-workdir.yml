name: Test custom workdir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create nim source file in a subdirectory
        run: |
          mkdir -p myproject/src
          cat > myproject/src/main.nim << 'EOF'
          echo "Hello from subdir"
          EOF
      - id: action
        uses: .
        with:
          github_token: dummy-token
          workdir: myproject
          src: src/main.nim
          reporter: local
          filter_mode: nofilter
          fail_level: none
      - name: Assert action completed successfully with custom workdir
        run: |
          echo "Action completed with custom workdir"
          echo "PASS"

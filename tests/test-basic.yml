name: Test basic usage - valid nim file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run nimlint action on committed nim fixture file
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          src: 'tests/fixtures/hello.nim'
          reporter: 'local'
          filter_mode: 'nofilter'
          fail_level: 'none'
          fail_on_error: 'false'
          level: 'error'

      - name: Assert action completed successfully
        run: |
          echo "Action completed without error"
          echo "PASS"

name: Test basic usage - valid nim file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create nim source file
        run: |
          mkdir -p src
          echo 'echo "hello world"' > src/hello.nim

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          src: 'src/hello.nim'
          reporter: 'local'
          filter_mode: 'nofilter'
          level: 'error'
          fail_level: 'none'

      - name: Assert action completed successfully
        run: |
          echo "Action completed without error"
          echo "PASS"

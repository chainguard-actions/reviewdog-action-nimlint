name: Test info level with local reporter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: 'tests/fixtures'
          src: 'hello.nim'
          level: 'info'
          reporter: 'local'
          filter_mode: 'nofilter'
          fail_level: 'none'

      - name: Assert action completed successfully with info level and local reporter
        run: |
          echo "Action completed with info level and local reporter"
          echo "PASS"

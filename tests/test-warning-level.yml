name: Test nim lint with warning level
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: dummy-token
          workdir: testdata
          reporter: local
          level: warning
          filter_mode: nofilter
          fail_level: none
          src: test1.nim

      - name: Assert action completed successfully with warning level
        run: |
          echo "PASS: nim lint action completed with warning level"

name: Test warning level with fail_level none
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run nimlint action with warning level and fail_level none
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          src: 'tests/fixtures/hello.nim'
          reporter: 'local'
          filter_mode: 'nofilter'
          fail_level: 'none'
          fail_on_error: 'false'
          level: 'warning'

      - name: Assert action completed successfully with warning level
        run: |
          echo "Action completed with warning level and fail_level=none without error"
          echo "PASS"
